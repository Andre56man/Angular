<header class="site-header" [class.scrolled]="scrolled() || menuOpen()">
  <div class="container nav">
    <a href="/#home" class="brand mono" (click)="closeMenu()">
      <span class="accent">&gt;_</span> kodjo.andre
    </a>

    <nav class="menu" [class.open]="menuOpen()" aria-label="Navigation principale">
      <ul>
        @for (link of links; track link.href; let i = $index) {
          <li>
            <a [href]="'/' + link.href" class="mono" [class.active]="active() === link.href" (click)="closeMenu()">
              <span class="num">0{{ i + 1 }}.</span>{{ link.label }}
            </a>
          </li>
        }
      </ul>
      <a [href]="cvUrl" download class="btn btn-ghost cv">cv.pdf</a>
    </nav>

    <button class="burger" [class.open]="menuOpen()" (click)="toggleMenu()"
            [attr.aria-expanded]="menuOpen()" aria-label="Ouvrir le menu">
      <span></span><span></span>
    </button>
  </div>
  <div class="progress" [style.transform]="'scaleX(' + progress() + ')'" aria-hidden="true"></div>
</header>
