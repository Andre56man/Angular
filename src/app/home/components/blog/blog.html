<section class="section" id="blog">
  <div class="container">
    <app-section-header index="05" title="Blog" comment="Notes techniques et retours d'expérience." />

    <div class="posts">
      @for (post of posts; track post.title; let i = $index) {
        <article class="card interactive post" appTilt [appReveal]="i * 110">
          <a href="#blog" class="thumb" tabindex="-1" aria-hidden="true">
            <img [src]="post.image" [alt]="post.title" loading="lazy">
          </a>
          <div class="body">
            <p class="meta mono">
              <time [attr.datetime]="post.date">{{ post.date }}</time>
              <span class="tag accent">#{{ post.tag }}</span>
            </p>
            <h3><a href="#blog">{{ post.title }}</a></h3>
            <p>{{ post.excerpt }}</p>
            <a href="#blog" class="read mono">lire l'article →</a>
          </div>
        </article>
      }
    </div>
  </div>
</section>
