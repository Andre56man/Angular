<section class="section alt" id="testimonial">
  <div class="container">
    <p class="label mono"><span class="accent">//</span> ce qu'on dit de mon travail</p>
    <div class="quotes">
      @for (item of testimonials; track item.author; let i = $index) {
        <figure class="card quote" [appReveal]="i * 120">
          <blockquote>
            <span class="mark mono" aria-hidden="true">"</span>
            <p>{{ item.quote }}</p>
          </blockquote>
          <figcaption>
            <strong>{{ item.author }}</strong>
            <span class="mono">{{ item.role }}</span>
          </figcaption>
        </figure>
      }
    </div>
  </div>
</section>
