<section class="section alt" id="service">
  <div class="container">
    <app-section-header index="02" title="Services" comment="Ce que je construis, de l'interface jusqu'à la base de données." />

    <div class="services">
      @for (service of services; track service.file; let i = $index) {
        <article class="window card interactive" appTilt [appReveal]="i * 110">
          <div class="window-bar">
            <div class="window-dots"><i></i><i></i><i></i></div>
            <span class="window-title">{{ service.file }}</span>
          </div>
          <div class="body">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path [attr.d]="service.icon" />
            </svg>
            <h3>{{ service.title }}</h3>
            <p>{{ service.description }}</p>
            <ul class="tags">
              @for (tech of service.stack; track tech) {
                <li class="tag">{{ tech }}</li>
              }
            </ul>
          </div>
        </article>
      }
    </div>
  </div>
</section>
