<section class="section alt" id="contact">
  <div class="container">
    <app-section-header index="06" title="Contact" comment="Un projet, une opportunité ou une question ? Écrivez-moi." />

    <div class="contact-grid">
      <div class="info" appReveal>
        <dl class="details">
          <div>
            <dt class="mono">email</dt>
            <dd><a [href]="'mailto:' + info.email">{{ info.email }}</a></dd>
          </div>
          <div>
            <dt class="mono">téléphone</dt>
            <dd><a [href]="info.phoneHref">{{ info.phone }}</a></dd>
          </div>
          <div>
            <dt class="mono">localisation</dt>
            <dd>{{ info.location }}</dd>
          </div>
        </dl>
        <app-social-links />
      </div>

      <form class="window" appReveal="120" (ngSubmit)="submit()" #f="ngForm">
        <div class="window-bar">
          <div class="window-dots"><i></i><i></i><i></i></div>
          <span class="window-title">nouveau_message.txt</span>
        </div>

        <div class="fields">
          <div class="row">
            <label>
              <span class="mono">nom</span>
              <input type="text" name="name" [(ngModel)]="form.name" required autocomplete="name">
            </label>
            <label>
              <span class="mono">email</span>
              <input type="email" name="email" [(ngModel)]="form.email" required autocomplete="email">
            </label>
          </div>
          <label>
            <span class="mono">sujet</span>
            <input type="text" name="subject" [(ngModel)]="form.subject" required>
          </label>
          <label>
            <span class="mono">message</span>
            <textarea name="message" rows="6" [(ngModel)]="form.message" required></textarea>
          </label>

          <div class="submit">
            <button type="submit" class="btn btn-primary" [disabled]="f.invalid">
              Envoyer
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
            @if (sent()) {
              <p class="status mono"><span class="c-ok">✓</span> votre messagerie s'ouvre avec le message pré-rempli</p>
            }
          </div>
        </div>
      </form>
    </div>
  </div>
</section>
